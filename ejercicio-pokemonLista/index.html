<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Pokémon Lista</title>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <main class="app">
            <header class="hero">
                <p class="hero-kicker">PokéDex visual</p>
                <h1>Pokémon Lista</h1>
                <p class="hero-copy">
                    Una pequeña galería de los primeros Pokémon cargados desde
                    la API.
                </p>
            </header>

            <section
                id="galeria"
                class="galeria-pokemon"
                aria-live="polite"
                aria-label="Galería de Pokémon"
            ></section>
        </main>
        <script src="js/main.js"></script>
    </body>
</html>
